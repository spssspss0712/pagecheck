name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 16 * * 1'  // Run every Monday at 16:00 UTC

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9.6'
    - run: python install -r requirements.txt
    - run: pytest -v


